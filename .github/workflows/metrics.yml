# Regenerates a single combined SVG (metrics.svg) using lowlighter/metrics
# Docs: https://github.com/lowlighter/metrics
name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"   # once a day — metrics data doesn't change fast enough to run more often
  workflow_dispatch:        # lets you trigger a run manually from the Actions tab
  push:
    branches: ["main"]
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🦑 Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg

          # Header, recent activity, community stats, featured repos
          base: header, activity, community, repositories

          # Lines of code changed
          plugin_lines: yes

          # Repos you're actively working on / forked.
          # TODO: replace with real owner/repo names, comma-separated.
          # A repo you forked into your own account is just "kaiju-no-9/repo-name",
          # same as anything else you own — it doesn't need special handling.
          plugin_repositories_featured: kaiju-no-9/REPLACE_WITH_REPO_YOU_ARE_WORKING_ON, kaiju-no-9/REPLACE_WITH_A_FORKED_REPO
          plugin_repositories_forks: yes

          # Isometric contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Most used languages
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_details: percentage
          plugin_languages_limit: 8

          # Followers
          plugin_people: yes
          plugin_people_types: followers
          plugin_people_limit: 24

          # Tech stack, rendered as icons — sourced from topics on repos you've
          # starred (see setup note in chat). Topics without a matching icon
          # (e.g. "mcp" as of now) won't render here.
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 0
