# Regenerates the SVGs referenced in README.md using lowlighter/metrics
# Docs: https://github.com/lowlighter/metrics
name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # once a day — metrics data doesn't change fast enough to run more often
  workflow_dispatch:        # lets you trigger a run manually from the Actions tab
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🦑 Metrics — left column (header + activity)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics-left.svg
          base: header, activity

      - name: 🦑 Metrics — right column (community, lines, repos I'm working on)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics-right.svg
          base: community
          plugin_lines: yes
          plugin_repositories: yes
          plugin_repositories_featured: kaiju-no-9/GrabPic, kaiju-no-9/t-8-t, kaiju-no-9/Pulse_Guard
          plugin_repositories_forks: yes

      - name: 🌐 Isometric contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: calendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: 💬 Most used languages breakdown
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_details: percentage
          plugin_languages_limit: 8

      - name: 👥 Followers
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: followers.svg
          base: ""
          plugin_people: yes
          plugin_people_types: followers
          plugin_people_limit: 24

      # lowlighter/metrics has no built-in "custom tech list" plugin — it only
      # knows what it can pull from your GitHub data. So the tech stack row is
      # fetched here as a real SVG and committed alongside the metrics files,
      # rather than being hotlinked live from skillicons.dev in the README.
      # Checkout happens now (after the steps above), so this picks up the
      # commits those steps already pushed instead of conflicting with them.
      - name: 📥 Checkout (for the manual commit below)
        uses: actions/checkout@v4

      - name: 🧰 Fetch tech stack as SVG
        run: |
          curl -s "https://skillicons.dev/icons?i=git,bash,prisma,mongodb,express,react,nodejs,postgres,figma,redis,aws,docker,kubernetes,py,fastapi,pytorch&perline=8" -o techstack.svg

      - name: 📦 Commit tech stack SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add techstack.svg
          git diff --staged --quiet || (git commit -m "chore: update techstack.svg" && git push)
