# Regenerates the SVGs referenced in README.md using lowlighter/metrics
# Docs: https://github.com/lowlighter/metrics
name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # once a day — metrics data doesn't change fast enough to run more often
  workflow_dispatch:        # lets you trigger a run manually from the Actions tab
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🦑 Main metrics (activity, community, repositories, lines, stars)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          base: header, activity, community, repositories
          plugin_lines: yes
          plugin_stars: yes
          plugin_stars_limit: 5

      - name: 🌐 Isometric contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: calendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: 💬 Most used languages breakdown
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_details: percentage
          plugin_languages_limit: 8
